name: CI

# Runs on pull requests (and on demand) only. Each run of the verify job
# waits for a maintainer's approval through the ci-approval environment;
# the "Review deployments" button appears on the pull request itself.
on:
  pull_request:
    branches:
      - main
      - dev
      - 'dev/**'
  workflow_dispatch:

# The build only reads the repository; the job token needs no write access.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ci-approval

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test, mutation test, and check style
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          retention-days: 14

  enforce-source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require pull requests into main to come from dev
        # The branch name is passed through an environment variable rather
        # than interpolated into the script, so a crafted branch name cannot
        # inject shell commands.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "dev" && "$HEAD_REF" != dev/* ]]; then
            echo "Pull requests into main must originate from 'dev' or a 'dev/**' branch, not '$HEAD_REF'."
            exit 1
          fi
